<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Álbum de fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf7f2; --ink:#3b3330; --gold:#b08d57; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font-family:'Cormorant Garamond', Georgia, serif; text-align:center; }
  main { width:100%; max-width:420px; padding:32px 24px; }
  .names { font-style:italic; font-size:2.4rem; color:var(--gold); margin:0 0 4px; }
  h1 { font-weight:400; font-size:1.5rem; margin:0 0 8px; letter-spacing:.04em; }
  p.sub { margin:0 0 28px; font-size:1.15rem; opacity:.8; }
  button.big { display:block; width:100%; padding:16px; margin:12px 0; font:inherit; font-size:1.3rem; font-weight:600;
         border-radius:999px; border:1.5px solid var(--gold); cursor:pointer; }
  .primary { background:var(--gold); color:#fff; }
  .secondary { background:transparent; color:var(--gold); }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin-top:22px; min-height:3em; font-size:1.15rem; }
  .bar { height:6px; background:#e8dfd0; border-radius:3px; overflow:hidden; margin-top:10px; display:none; }
  .bar > div { height:100%; width:0; background:var(--gold); transition:width .2s; }
  .ok { color:#5c7a4a; } .err { color:#a2402f; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<main>
  <div class="names" id="names"></div>
  <h1>Álbum de fotos</h1>
  <p class="sub">Comparte tus fotos de nuestra posada</p>

  <button class="big primary" id="btnCam">Tomar foto</button>
  <button class="big secondary" id="btnGal">Subir desde galería</button>

  <input type="file" id="inCam" accept="image/*" capture="environment">
  <input type="file" id="inGal" accept="image/*" multiple>

  <div class="bar" id="bar"><div id="barFill"></div></div>
  <div id="status"></div>
</main>

<script>
/* ====== CONFIGURACIÓN (edita solo esto) ====== */
const CONFIG = {
  names: "Posada Navideña",                 // Se muestra arriba de la página
  scriptUrl: "https://script.google.com/macros/s/AKfycbwzkmPdMk93oYB94Ai9P1FRybSsrxcGNTZVMhPUiiNTpEc3eRAcdZbpHuDDBDLe2Nqn/exec", // URL de la web app (termina en /exec)
  token: "posada-OladOqkgeWyO",               // Debe ser igual a TOKEN en Code.gs
  maxSide: 2200,                            // Lado máximo en píxeles (reduce peso)
  quality: 0.85
};
/* ============================================= */

document.getElementById('names').textContent = CONFIG.names;
const $ = id => document.getElementById(id);
const statusEl = $('status'), bar = $('bar'), fill = $('barFill');
const buttons = [$('btnCam'), $('btnGal')];

$('btnCam').onclick = () => $('inCam').click();
$('btnGal').onclick = () => $('inGal').click();
$('inCam').onchange = e => handle(e.target);
$('inGal').onchange = e => handle(e.target);

function setStatus(msg, cls) { statusEl.className = cls || ''; statusEl.textContent = msg; }

// Reduce la foto en el celular antes de subirla (más rápido con datos móviles)
function resize(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, CONFIG.maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('No se pudo procesar')), 'image/jpeg', CONFIG.quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Imagen no válida')); };
    img.src = url;
  });
}

function toBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function uploadOne(file) {
  const blob = await resize(file);
  const data = await toBase64(blob);
  // text/plain evita el preflight CORS con Apps Script
  const res = await fetch(CONFIG.scriptUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: CONFIG.token, mime: 'image/jpeg', data })
  });
  const out = await res.json();
  if (!out.ok) throw new Error(out.error || 'Error al guardar');
}

async function handle(input) {
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  buttons.forEach(b => b.disabled = true);
  bar.style.display = 'block'; fill.style.width = '0';
  let done = 0, failed = 0;
  for (const f of files) {
    setStatus(`Subiendo ${done + failed + 1} de ${files.length}…`);
    try { await uploadOne(f); done++; } catch (e) { failed++; console.error(e); }
    fill.style.width = ((done + failed) / files.length * 100) + '%';
  }
  buttons.forEach(b => b.disabled = false);
  if (failed === 0) setStatus(done === 1 ? '¡Listo! Tu foto ya está en el álbum 💛' : `¡Listo! ${done} fotos subidas 💛`, 'ok');
  else setStatus(`${done} subidas, ${failed} fallaron. Revisa tu conexión e inténtalo de nuevo.`, 'err');
}
</script>
</body>
</html>
